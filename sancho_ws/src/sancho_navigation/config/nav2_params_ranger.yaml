# =====================
# CONTROLLER SERVER (local)
# =====================
controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0

    # Subimos umbral mínimo para publicar omega y evitamos invertir por ruido
    min_x_velocity_threshold: 0.05
    min_y_velocity_threshold: 0.05
    min_theta_velocity_threshold: 0.15   

    # No declares fallo tan pronto ante dudas al inicio del giro
    failure_tolerance: 0.8               # antes 0.3

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    smoother_plugins: ["velocity_smoother"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 20.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 1.0

    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"

      # --- ANTI-OSCILACIÓN EN ROTATION SHIM ---
      # Engancha el modo rotación con margen y no lo suelta hasta estar bien alineado
      angular_dist_threshold: 1.20         # antes 1.00
      angular_disengage_threshold: 0.40    # antes 0.95 (¡histeresis grande!)
      rotate_to_heading_angular_vel: 1.0   # antes 1.0 (menos sobrepaso)
      max_angular_accel: 3.0               # antes 3.0 (menos vaivén)
      simulate_ahead_time: 0.0             # antes 1.0 (no “adivinar” la pose futura)
      rotate_to_goal_heading: true        # evita decidir yaw final aquí; hazlo con Spin

      # --- MPPI ---
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.4

      vx_max: 0.4
      vx_min: 0.0
      vy_max: 0.0
      vy_min: -0.0
      wz_max: 1.0

      ax_max: 0.5
      ax_min: -0.5
      az_max: 1.0

      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.5
      gamma: 0.015
      motion_model: "Ackermann"
      visualize: true
      retry_attempt_limit: 3

      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      AckermannConstraints:
        min_turning_r: 0.4764

      critics:
         - "ConstraintCritic"
         - "CostCritic"
         - "GoalCritic"
         - "PathAlignCritic"
         - "PathFollowCritic"
         - "PathAngleCritic"
         - "PreferForwardCritic"
         - "VelocityDeadbandCritic"

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4

      PathAlignCritic:
        enabled: false
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: true

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0   # antes 5.0: menos sesgo que puede “pelearse” con el giro

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2

      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        cost_weight: 20.0  # antes 30.0
        deadband_velocities: [0.00, 0.00, 0.15]  # antes 0.1

    velocity_smoother:
      plugin: "nav2_velocity_smoother::VelocitySmoother"
      smoothing_frequency: 20.0
      scale_velocities: false
      # Usa CLOSED_LOOP si tu odometría es buena; ayuda a amortiguar inversión de signo
      feedback: "CLOSED_LOOP"             # antes OPEN_LOOP
      max_velocity: [0.4, 0.0, 1.0]
      min_velocity: [0.05, 0.0, 0.15]     # antes 0.1
      max_accel: [0.5, 0.0, 1.0]
      max_decel: [-0.5, 0.0, -1.0]
      deadband_velocity: [0.02, 0.0, 0.15]  # antes 0.1
      velocity_timeout: 1.0

    plugin_lib_names:
      - "nav2_mppi_controller"

controlle_server:
  ros__parameters:
    controller_frequency: 20.0
    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # Velocidades y límites (ajusta a tu robot)
      desired_linear_vel: 0.35
      max_linear_accel: 0.6
      max_linear_decel: 0.6

      # Differential: permite marcha atrás si te interesa
      allow_reversing: true

      # Lookahead (anti-atajo = mirar “no muy lejos”)
      lookahead_dist: 0.6
      min_lookahead_dist: 0.35
      max_lookahead_dist: 0.9
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 0.0
      use_interpolation: true
      transform_tolerance: 0.1
      max_robot_pose_search_dist: 0.6

      # Regulación por coste/curvatura (pegarse al path y frenar en curvas)
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.6
      regulated_linear_scaling_min_speed: 0.1
      regulated_linear_scaling_min_radius: 0.30   # radio giro práctico de tu diff

      # Aproximación al goal y giros en sitio (diff lo hace bien)
      use_rotate_to_heading: true
      rotate_to_heading_lookahead: 0.35
      approach_velocity_scaling_dist: 0.6

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

# =====================
# PLANNER SERVER (global)
# =====================

planner_server:
  ros__parameters:
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:

      plugin: "nav2_smac_planner/SmacPlanner2D"

      # ===== Comportamiento general =====
      tolerance: 0.20                    # margen p/aceptar goal si no cae exacto (m)
      allow_unknown: true                # true si usas SLAM/espacio desconocido navegable
      max_iterations: 1000000            # -1 para sin límite (mejor dejar límite)
      max_on_approach_iterations: 1500   # intenta refinar cuando ya está dentro de 'tolerance'
      terminal_checking_interval: 4000   # chequeos de cancelación cada N expansiones
      max_planning_time: 1.0             # s: mantenerlo bajo para replanes ágiles

      # ===== Downsampling (acelerar búsqueda) =====
      downsample_costmap: true           # baja resolución para el grafo (más rápido)
      downsampling_factor: 2             # p.ej. costmap 0.05 m -> grafo a 0.10 m

      # ===== Evitar “pegarse” a obstáculos =====
      # Aumenta este factor si quieres ir más centrado en pasillos (con mapa inflado).
      # 1.0 = prioriza RÁPIDO, 2.0~3.0 = tradeoff seguro, >3 puede alargar un poco.
      cost_travel_multiplier: 2.0

      # ===== Orientación en la aproximación =====
      # MUY IMPORTANTE para tu caso: NO imponer orientación final en el plan.
      use_final_approach_orientation: false

      # ===== Suavizado interno =====
      smooth_path: true                  # (implícito al tener bloque smoother)
      smoother:
        max_iterations: 800              # 500–1200 típico
        w_smooth: 0.35                   # peso de suavidad (↑ = más liso)
        w_data: 0.20                     # conserva trayectoria original
        tolerance: 1.0e-10               # umbral de convergencia
        do_refinement: true              # refinamiento recursivo
        refinement_num: 2                # nº de pasadas extra (>=1)

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

# =====================
# MAP SERVER
# =====================
map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "/home/mapir/sancho_robot/sancho_ws/src/sancho_navigation/maps/mapir_lab_navigation.yaml"

map_server_localization:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "/home/mapir/sancho_robot/sancho_ws/src/sancho_navigation/maps/mapir_lab_localization.yaml"
# =====================
# GLOBAL COSTMAP
# =====================
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False        # Robot real
      global_frame: "map"        # Typically 'map'
      track_unknown_space: false
      robot_base_frame: "base_footprint"
      resolution: 0.025
      downsample_costmap: false

      footprint_padding: 0.03
      transform_tolerance: 0.2

      # Frecuencias típicas
      update_frequency: 1.0
      publish_frequency: 1.0

      # Radio del robot (o footprint)
      footprint: "[[-0.375, -0.275], [-0.375, 0.275], [0.375, 0.275], [0.375, -0.275]]"


      # Lista de capas
      plugins:
        - "static_layer"
        - "obstacle_layer"
        - "inflation_layer"

      # Static layer
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_subscribe_transient_local: true
        subscribe_to_updates: false
        transform_tolerance: 0.2

      # Obstacle layer
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: true
        max_obstacle_height: 2.0
        combination_method: 1
        observation_sources: "laser_front laser_back"

        laser_front:
          topic: "/scan_1st"
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          observation_persistence: 0.5  

        laser_back:
          topic: "/scan_2nd"
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          observation_persistence: 0.5
        
      # Inflation layer
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.5       # Mucho mayor que el radio inscrito (~0.275 m)
        cost_scaling_factor: 3.0    # Coste decrece de forma gradual
        inflate_unknown: true
        inflate_around_unknown: true


      # Costmap completo
      always_send_full_costmap: True

# =====================
# LOCAL COSTMAP
# =====================
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False          # Robot real
      global_frame: "odom"         # Típico para local costmap
      robot_base_frame: "base_footprint"
      resolution: 0.05
      transform_tolerance: 0.2

      rolling_window: true
      width: 5
      height: 5

      # Frecuencias del local costmap
      update_frequency: 20.0
      publish_frequency: 10.0

      footprint: "[[-0.375, -0.275], [-0.375, 0.275], [0.375, 0.275], [0.375, -0.275]]"
      footprint_padding: 0.03

      plugins:
        - "voxel_layer"
        - "obstacle_layer"
        - "inflation_layer"

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        voxel_decay: 0.5         # Obstáculos desaparecen rápido
        decay_model: 0           # 0: Tiempo fijo
        voxel_size: 0.05
        z_voxels: 10
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: "camera_depth"
        publish_voxel_map: true
        camera_depth:
          topic: "/astra_camera/camera/depth/points"
          data_type: "PointCloud2"
          marking: true
          clearing: true
          obstacle_range: 5.0
          raytrace_range: 5.5
          min_obstacle_height: 0.1
          max_obstacle_height: 1.8


      # Obstacle layer local
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: true
        max_obstacle_height: 2.0
        combination_method: 1
        observation_sources: "laser_front laser_back"
        observation_persistence: 0.2
        obstacle_range: 5.0
        raytrace_range: 5.5

        laser_front:
          topic: "/scan_1st"
          max_obstacle_height: 2.0
          clearing: True
          marking: True
        laser_back:
          topic: "/scan_2nd"
          max_obstacle_height: 2.0
          clearing: True
          marking: True
        camera_depth:
          topic: "/scan_camera"
          clearing: True
          marking: True
          min_obstacle_height: 0.1
          max_obstacle_height: 1.8

      # Inflation layer local
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.35       # Mucho mayor que el radio inscrito (~0.275 m)
        cost_scaling_factor: 3.0    # Coste decrece de forma gradual
        inflate_unknown: true
        inflate_around_unknown: true



# =====================
# BEHAVIOR SERVER
# =====================
behavior_server:
  ros__parameters:
    use_sim_time: False
    costmap_topic: "local_costmap/costmap_raw"
    footprint_topic: "local_costmap/published_footprint"
    cycle_frequency: 20.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: "odom"
    robot_base_frame: "base_footprint"
    transform_timeout: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5    # Reducido para giros más controlados
    min_rotational_vel: 0.3    # Incrementado para evitar giros demasiado lentos
    rotational_acc_lim: 1.0    # Menor aceleración en rotación para suavizar el giro


# Collision Monitor Plugin
collision_monitor:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_raw"
    cmd_vel_out_topic: "cmd_vel"
    transform_tolerance: 0.1
    source_timeout: 2.0
    stop_pub_timeout: 0.5
    base_shift_correction: true
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint: "[[-0.375, -0.275], [-0.375, 0.275], [0.375, 0.275], [0.375, -0.275]]"
      time_before_collision: 1.0
      simulation_time_step: 0.1
      max_points: 1
      visualize: true
        
    observation_sources: ["scan_front", "scan_back", "camera_depth"]
    scan_front:
      type: "scan"
      topic: "/scan_1st"
      min_height: 0.0
      max_height: 2.0

    scan_back:
      type: "scan"
      topic: "/scan_2nd"
      min_height: 0.0
      max_height: 2.0

    camera_depth:
      type: "scan"
      topic: "/scan_camera"
      min_height: 0.0
      max_height: 2.0
