# =====================
# CONTROLLER SERVER (local)
# =====================
controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0

    # Subimos umbral mínimo para publicar omega y evitamos invertir por ruido
    min_x_velocity_threshold: 0.05
    min_y_velocity_threshold: 0.05
    min_theta_velocity_threshold: 0.15   

    # No declares fallo tan pronto ante dudas al inicio del giro
    failure_tolerance: 0.8               # antes 0.3

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    smoother_plugins: ["velocity_smoother"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 20.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 1.0

    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"

      # --- ANTI-OSCILACIÓN EN ROTATION SHIM ---
      # Engancha el modo rotación con margen y no lo suelta hasta estar bien alineado
      angular_dist_threshold: 1.20         # antes 1.00
      angular_disengage_threshold: 0.20    # antes 0.95 (¡histeresis grande!)
      rotate_to_heading_angular_vel: 1.0   # antes 1.0 (menos sobrepaso)
      max_angular_accel: 3.0               # antes 3.0 (menos vaivén)
      simulate_ahead_time: 0.0             # antes 1.0 (no “adivinar” la pose futura)
      rotate_to_goal_heading: true        # evita decidir yaw final aquí; hazlo con Spin

      # --- MPPI ---
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.4

      vx_max: 0.4
      vx_min: 0.0
      vy_max: 0.0
      vy_min: -0.0
      wz_max: 1.0

      ax_max: 0.5
      ax_min: -0.5
      az_max: 1.0

      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.5
      gamma: 0.015
      motion_model: "Ackermann"
      visualize: true
      retry_attempt_limit: 3

      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      AckermannConstraints:
        min_turning_r: 0.4764

      critics:
         - "ConstraintCritic"
         - "CostCritic"
         - "GoalCritic"
         - "PathAlignCritic"
         - "PathFollowCritic"
         - "PathAngleCritic"
         - "PreferForwardCritic"
         - "VelocityDeadbandCritic"

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4

      PathAlignCritic:
        enabled: false
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: true

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0   # antes 5.0: menos sesgo que puede “pelearse” con el giro

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2

      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        cost_weight: 20.0  # antes 30.0
        deadband_velocities: [0.02, 0.00, 0.15]  # antes 0.1

    velocity_smoother:
      plugin: "nav2_velocity_smoother::VelocitySmoother"
      smoothing_frequency: 20.0
      scale_velocities: false
      # Usa CLOSED_LOOP si tu odometría es buena; ayuda a amortiguar inversión de signo
      feedback: "CLOSED_LOOP"             # antes OPEN_LOOP
      max_velocity: [0.4, 0.0, 1.0]
      min_velocity: [0.05, 0.0, 0.15]     # antes 0.1
      max_accel: [0.3, 0.0, 0.5]
      max_decel: [-0.4, 0.0, -0.5]
      deadband_velocity: [0.02, 0.0, 0.15]  # antes 0.1
      velocity_timeout: 1.0

    plugin_lib_names:
      - "nav2_mppi_controller"

