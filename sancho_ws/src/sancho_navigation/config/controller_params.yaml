# =====================
# LOCAL COSTMAP
# =====================
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False          # Robot real
      global_frame: "odom"         # Típico para local costmap
      robot_base_frame: "base_footprint"
      resolution: 0.05
      transform_tolerance: 0.2

      rolling_window: true
      width: 5
      height: 5

      # Frecuencias del local costmap
      update_frequency: 20.0
      publish_frequency: 10.0

      footprint: "[[-0.375, -0.275], [-0.375, 0.275], [0.375, 0.275], [0.375, -0.275]]"
      footprint_padding: 0.03

      plugins:
        - "voxel_layer"
        - "obstacle_layer"
        - "inflation_layer"

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        voxel_decay: 0.5         # Obstáculos desaparecen rápido
        decay_model: 0           # 0: Tiempo fijo
        voxel_size: 0.05
        z_voxels: 10
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: "camera_depth"
        publish_voxel_map: true
        camera_depth:
          topic: "/scan_camera"     #"/astra_camera/camera/depth/points"
          data_type: "PointCloud2"
          marking: true
          clearing: true
          obstacle_range: 5.0
          raytrace_range: 5.5
          min_obstacle_height: 0.1
          max_obstacle_height: 1.8


      # Obstacle layer local
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: true
        max_obstacle_height: 2.0
        combination_method: 1
        observation_sources: "laser_front laser_back"
        observation_persistence: 0.2
        obstacle_range: 5.0
        raytrace_range: 5.5

        laser_front:
          topic: "/scan_1st"
          max_obstacle_height: 2.0
          clearing: True
          marking: True
        laser_back:
          topic: "/scan_2nd"
          max_obstacle_height: 2.0
          clearing: True
          marking: True
        camera_depth:
          topic: "/scan_camera"
          clearing: True
          marking: True
          min_obstacle_height: 0.1
          max_obstacle_height: 1.8

      # Inflation layer local
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.55       # Mucho mayor que el radio inscrito (~0.275 m)
        cost_scaling_factor: 10.0    # Coste decrece de forma gradual
        inflate_unknown: true
        inflate_around_unknown: true


