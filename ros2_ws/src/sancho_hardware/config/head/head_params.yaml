head_controller_node:
  ros__parameters:
    auto_move_enabled: False
    idle_move_min_interval: 10.0
    idle_move_max_interval: 20.0
    pan_limit: [-1.56, 1.56]
    tilt_limit: [-0.30, 0.0]
    tolerance: 0.001
    tracking_timeout: 5.0
    joint_group_name: "turret"
    pan_joint: "pan"
    tilt_joint: "tilt"
    tracking_topic: "/head_goal"
    profile_velocity: 100
    profile_acceleration: 100