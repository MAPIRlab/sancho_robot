smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["SimpleSmoother"]
    SimpleSmoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True
      # Add these parameters to control the behavior:
      w_data: 0.5    # Increase (default 0.2) to stick closely to the yellow line
      w_smooth: 0.2  # Decrease (default 0.3) to stop aggressive corner-cutting
    SavitzkyGolaySmoother:
      plugin: "nav2_smoother::SavitzkyGolaySmoother"