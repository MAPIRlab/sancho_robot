# =====================
# CONTROLLER SERVER (local)
# =====================
controller_server:
  ros__parameters:
    use_sim_time: False
    robot_base_frame: "base_footprint"
    controller_frequency: 20.0

    # Esto afecta a la velocidad que publica el controlador, lo que puede afectar a la aceleracion
    min_x_velocity_threshold: -0.2
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: -0.05   

    failure_tolerance: 0.8

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    smoother_plugins: ["velocity_smoother"]
    controller_plugins: ["GeneralMPPI", "TightRPP"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 5.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.5
      yaw_goal_tolerance: 0.3

    GeneralMPPI:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"

      # --- PARAMETROS SHIM ---
      # Engancha el modo rotación con margen y no lo suelta hasta estar bien alineado
      angular_dist_threshold: 1.20         
      angular_disengage_threshold: 0.20    # Coast slowly into tolerance
      rotate_to_heading_angular_vel: 1.0   # Fast (57 deg/s) as requested
      max_angular_accel: 2.0               # High acceleration
      simulate_ahead_time: 1.0             
      rotate_to_goal_heading: true       
      closed_loop: true 

      # --- MPPI ---
      time_steps: 56
      model_dt: 0.05
      batch_size: 1500

      vx_std: 0.35    # Vel std dev
      vy_std: 0.0
      wz_std: 0.2

      vx_max: 0.4
      vx_min: -0.3
      vy_max: 0.0
      vy_min: -0.0
      wz_max: 1.2

      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.5
      gamma: 0.015
      motion_model: "Ackermann"
      visualize: false
      retry_attempt_limit: 3

      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      AckermannConstraints:
        min_turning_r: 0.4764

      critics:
         - "ConstraintCritic"
         #- "CostCritic"
         - "ObstaclesCritic"
         - "GoalCritic"
         - "PathAlignCritic"
         - "PathFollowCritic"
         - "PathAngleCritic"
         - "PreferForwardCritic"
         - "VelocityDeadbandCritic"

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      GoalCritic:
        enabled: true
        cost_power: 2
        cost_weight: 5.0
        threshold_to_consider: 1.4

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: true

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.0 

      # CostCritic:
      #   enabled: true
      #   cost_power: 1
      #   cost_weight: 8.0
      #   critical_cost: 300.0
      #   consider_footprint: true
      #   collision_cost: 1000000.0
      #   near_goal_distance: 1.0
      #   trajectory_point_step: 2

      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.5      # Pushes the robot away from the inflation layer smoothly
        critical_weight: 20.0      # Hard penalty for getting too close
        consider_footprint: true
        collision_cost: 1000000.0  # Keep this massive
        collision_margin_distance: 0.10 # Distance to trigger critical_weight
        near_goal_distance: 0.5

      VelocityDeadbandCritic:
        enabled: false
        cost_power: 1
        cost_weight: 20.0
        deadband_velocities: [0.05, 0.00, 0.15]

    TightRPP:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      
      # --- Parámetros del SHIM  ---
      angular_dist_threshold: 0.5  # Se activa con menos error para asegurar alineación perfecta
      angular_disengage_threshold: 0.05
      rotate_to_heading_angular_vel: 1.0 # Rotación más lenta y precisa
      max_angular_accel: 1.0
      simulate_ahead_time: 0.0
      rotate_to_goal_heading: true

      # --- Parámetros de Regulated Pure Pursuit ---
      desired_linear_vel: 0.15
      lookahead_dist: 0.4
      min_lookahead_dist: 0.1
      max_lookahead_dist: 0.6
      use_velocity_scaled_lookahead_dist: true
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0

    velocity_smoother:
      plugin: "nav2_velocity_smoother::VelocitySmoother"
      smoothing_frequency: 20.0
      scale_velocities: false
      # Usa CLOSED_LOOP si tu odometría es buena; ayuda a amortiguar inversión de signo
      feedback: "CLOSED_LOOP"             # antes OPEN_LOOP
      max_velocity: [0.4, 0.0, 1.0]
      min_velocity: [-0.2, 0.0, -0.1]     # antes 0.1
      max_accel: [0.2, 0.0, 0.5]
      max_decel: [-0.4, 0.0, -2.5]        # Incremented Z decel from -0.5 to -2.5 so it can brake fast
      deadband_velocity: [0.02, 0.0, 0.05]  # antes 0.1
      velocity_timeout: 1.0

    plugin_lib_names:
      - "nav2_mppi_controller"

# =====================
# LOCAL COSTMAP
# =====================
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False          # Robot real
      global_frame: "odom"         # Típico para local costmap
      robot_base_frame: "base_footprint"
      resolution: 0.01
      transform_tolerance: 0.2

      rolling_window: true
      width: 5
      height: 5

      # Frecuencias del local costmap
      update_frequency: 20.0
      publish_frequency: 10.0

      footprint: "[[-0.375, -0.25], [-0.375, 0.25], [0.375, 0.25], [0.375, -0.25]]"
      footprint_padding: 0.005

      plugins:
        - "voxel_layer"
        - "obstacle_layer"
        - "inflation_layer"

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        voxel_decay: 0.5         # Obstáculos desaparecen rápido
        decay_model: 0           # 0: Tiempo fijo
        voxel_size: 0.01
        z_voxels: 10
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: "camera_depth"
        publish_voxel_map: true
        camera_depth:
          topic: "/scan_camera"     #"/astra_camera/camera/depth/points"
          data_type: "PointCloud2"
          marking: true
          clearing: true
          obstacle_range: 5.0
          raytrace_range: 5.5
          min_obstacle_height: 0.1
          max_obstacle_height: 1.8


      # Obstacle layer local
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: true
        max_obstacle_height: 2.0
        combination_method: 1
        observation_sources: "laser_front laser_back"
        observation_persistence: 0.2
        obstacle_range: 5.0
        raytrace_range: 5.5

        laser_front:
          topic: "/scan_1st"
          max_obstacle_height: 2.0
          clearing: True
          marking: True
        laser_back:
          topic: "/scan_2nd"
          max_obstacle_height: 2.0
          clearing: True
          marking: True
        camera_depth:
          topic: "/scan_camera"
          clearing: True
          marking: True
          min_obstacle_height: 0.1
          max_obstacle_height: 1.8

      # Inflation layer local
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 2.0      
        cost_scaling_factor: 5.0
        inflate_unknown: true
        inflate_around_unknown: true