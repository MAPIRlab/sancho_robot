collision_monitor:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_raw"
    cmd_vel_out_topic: "cmd_vel"
    transform_tolerance: 0.1
    source_timeout: 2.0
    stop_pub_timeout: 0.5
    base_shift_correction: true
    polygons: ["SlowdownApproach"]
    observation_sources: ["laser_front", "laser_back", "camera_depth"]

    laser_front:
      topic: "/scan_1st"
      max_obstacle_height: 2.0
      clearing: True
      marking: True
    laser_back:
      topic: "/scan_2nd"
      max_obstacle_height: 2.0
      clearing: True
      marking: True
    camera_depth:
      topic: "/scan_camera"
      clearing: True
      marking: True
      min_obstacle_height: 0.1
      max_obstacle_height: 1.8

    SlowdownApproach:
      type: "polygon"
      action_type: "slowdown"
      # En algunas versiones de Humble, el ratio debe ser un double explícito
      slowdown_ratio: 0.2 
      # Formato de lista plana: [x1, y1, x2, y2, x3, y3, x4, y4]
      # Definimos un área de aprox 1.0m x 0.55m (el robot mide 0.7x0.5)
      points: [0.5, 0.275, 0.5, -0.275, -0.5, -0.275, -0.5, 0.275]
      # min_points: Necesario para filtrar ruido
      min_points: 5
      visualize: true
